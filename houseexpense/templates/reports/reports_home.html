{% extends 'base.html' %}

{% block title %}Reports - Samprity Abason{% endblock %}

{% block content %}
<div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
        <i class="fas fa-file-alt text-blue-600"></i> Reports
    </h1>
</div>

{% if house %}
<div class="max-w-sm">
    <div class="card">
        <div class="px-5 py-4 border-b border-gray-100">
            <h5 class="font-semibold text-gray-800">{{ house.name }}</h5>
            <p class="text-xs text-gray-500 mt-0.5">Select a report type to view</p>
        </div>
        <div class="p-5 space-y-3">
            <a href="{% url 'reports:flat_wise_report' house.id %}"
               class="btn-outline-info w-full justify-start gap-3">
                <i class="fas fa-door-open w-4 text-center"></i>
                Flat Wise Report
            </a>
            <a href="{% url 'reports:month_wise_report' house.id %}"
               class="btn-outline-success w-full justify-start gap-3">
                <i class="fas fa-calendar-alt w-4 text-center"></i>
                Month Wise Report
            </a>
        </div>
    </div>
</div>
{% else %}
<div class="alert-warning max-w-md">
    <i class="fas fa-exclamation-triangle shrink-0"></i>
    <span>No house configured yet.</span>
</div>
{% endif %}
{% endblock %}
