{% extends 'base.html' %}

{% block title %}Logout - Samprity Abason{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[calc(100vh-8rem)] py-8">
    <div class="w-full max-w-sm">
        <div class="card text-center">
            <div class="px-6 py-5 border-b border-gray-100">
                <i class="fas fa-sign-out-alt text-red-500 text-3xl mb-2"></i>
                <h4 class="text-lg font-semibold text-gray-800">Logout</h4>
            </div>
            <div class="p-6">
                <p class="text-gray-600 mb-6">Are you sure you want to logout?</p>
                <form method="post" action="{% url 'accounts:logout' %}">
                    {% csrf_token %}
                    <div class="flex gap-3 justify-center">
                        <button type="submit" class="btn-danger">
                            <i class="fas fa-sign-out-alt"></i> Yes, Logout
                        </button>
                        <a href="{% url 'core:home' %}" class="btn-outline">
                            <i class="fas fa-times"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
